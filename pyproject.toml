[project]
name = "x402-exchange"
version = "0.2.0"
description = "Autonomous x402 exchange -- Qwen3-8B on Modal, paid via USDC, self-improving"
requires-python = ">=3.12"
dependencies = [
    "x402[fastapi,httpx,evm]",
    "uvicorn",
    "python-dotenv",
    "eth-account",
    "mcp[cli]",
    "structlog",
    "cdp-sdk",
    "web3",
    "httpx",
    "pydantic>=2.0",
    "modal",
]

[project.scripts]
seller = "seller:main"
buyer = "buyer:main"
mcp-server = "mcp_server:main"
mcp-buyer = "mcp_buyer:main"
bootstrap = "bootstrap:main"
ledger = "ledger:main"
finetune = "finetune:main"
